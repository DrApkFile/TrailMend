name: gate
on: [push, pull_request]
permissions: { contents: read }
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.32" }
      - run: uv sync --frozen
      - run: make gate
  live:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.32" }
      - run: uv sync --frozen
      - run: make hydra-up
      - run: make verify
