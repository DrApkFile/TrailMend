[project]
name = "trailmend"
version = "0.1.0"
description = "The graph that repairs its own relationships. Built on HydraDB OSS."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi==0.121.1",
  "uvicorn[standard]==0.38.0",
  "httpx==0.28.1",
  "pydantic==2.12.4",
  "pydantic-settings==2.12.0",
]

[dependency-groups]
dev = [
  "pytest==9.0.1",
  "hypothesis==6.148.2",
  "ruff==0.14.5",
  "pyright==1.1.407",
  "moto[server]==5.2.5",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trailmend"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF", "PL", "PT", "TRY", "BLE", "ERA"]
ignore = ["PLR2004", "TRY003", "PLR0913"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hydra: needs a live HydraDB (skipped with a reason when unreachable)"]
addopts = "-ra --strict-markers"
